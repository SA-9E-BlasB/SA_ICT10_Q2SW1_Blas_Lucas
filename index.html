<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- pyscript is what lets our python file work on the webpage -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <!-- bootstrap handles the basic spacing and form layout -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>ICT Club | Candidate Verification</title>
    <style>
        /* keeping the whole page dark, so the shapes don't take over everything */
        body { min-height: 100vh; margin: 0; background: #090b10; color: #f5f6f8; font-family: Arial, sans-serif; overflow-x: hidden; }
        /* these shapes are just css, so no extra code needed for them to show */
        .shape { position: fixed; pointer-events: none; z-index: 0; }
        /* a big outlined polygon at the top, kept subtle on purpose */
        .shape-one { width: 460px; height: 460px; top: -230px; right: -110px; background: #272c37; clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
        .shape-one::after { content: ""; position: absolute; inset: 3px; background: #090b10; clip-path: inherit; }
        /* the bottom shape gives the page a little more balance */
        .shape-two { width: 390px; height: 390px; bottom: -240px; left: -160px; background: #1d222c; clip-path: polygon(20% 0%, 100% 10%, 82% 90%, 0% 100%); }
        .shape-two::after { content: ""; position: absolute; inset: 3px; background: #090b10; clip-path: inherit; }
        /* the diagonal lines are just background detail, not extra elements */
        .page-lines { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(135deg, transparent 0px, transparent 82px, #ffffff05 83px, transparent 84px); }
        /* this keeps the actual form above all the background decorations */
        .main-layout { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 8vh 18px 45px; }
        /* main panel, with a dark surface and thin border */
        .club-card { background: #12161e; border: 1px solid #343b47; border-radius: 16px; padding: 40px; box-shadow: 0 24px 70px #00000080; position: relative; overflow: hidden; }
        /* this tiny clipped corner makes the card look a bit more geometric */
        .club-card::before { content: ""; position: absolute; top: 0; right: 0; width: 90px; height: 90px; background: #242a34; clip-path: polygon(100% 0, 100% 100%, 0 0); }
        /* small diamond icon to match the angular theme */
        .symbol { width: 37px; height: 37px; border: 2px solid #a5afc0; transform: rotate(45deg); margin: 9px 0 29px 9px; }
        .eyebrow { color: #aeb8c7; font-size: 11px; font-weight: bold; letter-spacing: 2.5px; }
        h1 { color: #ffffff; font-size: clamp(27px, 5vw, 38px); font-weight: 800; letter-spacing: -1px; }
        .subtitle { color: #a5afbd; font-size: 14px; }
        /* labels stay light so they're readable against the dark card */
        .form-label { color: #dce1e8; font-size: 13px; font-weight: 600; }
        /* these are still the same two input boxes from the original code */
        .form-control { background: #0c1017; border: 1px solid #394250; border-radius: 8px; color: #ffffff; padding: 14px 15px; }
        .form-control::placeholder { color: #8792a3; }
        /* when someone clicks a field, the border gets a bit lighter */
        .form-control:focus { background: #0c1017; color: #ffffff; border-color: #aeb8c7; box-shadow: 0 0 0 3px #aeb8c71a; }
        /* the button stays dark too, just with a brighter border */
        .btn-primary { background: #252c37; border: 1px solid #647184; color: #ffffff; border-radius: 8px; padding: 14px; font-weight: bold; }
        .btn-primary:hover { background: #343e4d; border-color: #9caabd; color: #ffffff; }
        /* python changes the text inside this box after checking the name */
        #output { min-height: 75px; padding: 19px; background: #0c1017; border: 1px solid #343d49; border-left: 3px solid #a5afc0; border-radius: 8px; color: #f2f5f8; font-size: 15px; overflow-wrap: anywhere; }
        .result-label { color: #aeb8c7; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
        .footer-note { color: #778291; font-size: 11px; letter-spacing: 1px; text-align: center; margin-top: 22px; }
        /* on smaller screens, the card gets less padding so it still fits */
        @media (max-width: 600px) { .main-layout { padding-top: 35px; } .club-card { padding: 27px 22px; } }
    </style>
</head>
<body>
    <!-- just decorative shapes, not connected to the python checker -->
    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="page-lines"></div>

    <div class="main-layout">
        <div class="club-card">
            <div class="symbol"></div>
            <p class="eyebrow">ICT CLUB / MEMBER PORTAL</p>
            <h1 class="mb-2">Candidate Verification</h1>
            <p class="subtitle mb-4">Enter your name to check if you're on the club list.</p>

            <!-- this contains the original two name inputs and the submit button -->
            <div class="mb-4">
                <div class="mb-3">
                    <label for="first_name" class="form-label">First name</label>
                    <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                </div>
                <div class="mb-3">
                    <label for="last_name" class="form-label">Last name</label>
                    <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                </div>
                <!-- py-click runs the python function when this button is clicked -->
                <input type="button" value="Verify membership" py-click="result_checker" class="btn btn-primary w-100">
            </div>

            <!-- this is where the message from main.py will appear -->
            <p class="result-label mb-2">VERIFICATION RESULT</p>
            <div id="output" aria-live="polite">Your result will appear here.</div>
        </div>
        <p class="footer-note">ICT CLUB &nbsp; / &nbsp; CANDIDATE SYSTEM</p>
    </div>

    <!-- same separate python file, loaded by pyscript -->
    <script type="py" src="./main.py"></script>
</body>
</html>
